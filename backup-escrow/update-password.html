<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password | HABACHA</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--canvas-light); padding: 40px 20px; }
        .auth-card { background: var(--surface-white); border: 1px solid var(--border-subtle-light); border-radius: 8px; padding: 50px; width: 100%; max-width: 480px; box-shadow: var(--shadow-institutional); }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header" style="text-align: center; margin-bottom: 30px;">
                <h1 style="font-family: var(--font-heading); color: var(--color-navy-main); font-size: 28px;">Secure Password Reset</h1>
                <p style="font-size: 14px; color: var(--text-light-secondary);">Enter your new password below.</p>
            </div>
            <form id="updateForm" onsubmit="return false;">
                <div class="search-field" style="border: 1px solid var(--border-subtle-light); border-radius: 4px; margin-bottom: 20px; padding: 12px;">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" class="btn-search" id="updateBtn" style="width: 100%;">Update Password</button>
            </form>
            <p id="msg" style="text-align: center; margin-top: 15px; font-size: 13px; display: none;"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://fwiyrtchfbjpwrbvzynb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_rej1BmE3pLsiHB2fOrrGqA_IkcGBCX5';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('updateBtn');
            const msg = document.getElementById('msg');
            const newPassword = document.getElementById('newPassword').value;
            
            btn.innerText = 'Updating...';
            
            const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
            
            if (error) {
                msg.innerText = 'Error: ' + error.message;
                msg.style.color = 'red';
                msg.style.display = 'block';
                btn.innerText = 'Update Password';
            } else {
                msg.innerText = '✅ Password updated successfully. Redirecting to login...';
                msg.style.color = 'green';
                msg.style.display = 'block';
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            }
        });
    </script>
</body>
</html>
