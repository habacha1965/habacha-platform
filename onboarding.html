<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Onboarding & Intake | HABACHA Platform</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="logo-container">
      <a href="index.html" class="logo-text">HABACHA</a>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="inventory.html">Browse Assets</a>
      <a href="onboarding.html" class="active">List / Inquire</a>
      <a href="suppliers.html">Suppliers (B2B)</a>
      <a href="admin.html">Admin Console</a>
    </nav>
  </header>

  <div class="container" style="max-width: 800px; margin: 50px auto; padding: 0 20px;">
    <div class="hero-text" style="text-align: center; margin-bottom: 40px;">
      <h1>Client Onboarding & Intake</h1>
      <p style="color: #94A3B8; font-size: 1.1rem; margin-top: 10px;">
        For private individuals, VIPs, corporate logistics partners, and asset owners worldwide.
      </p>
    </div>

    <div style="background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(197, 168, 128, 0.2); border-radius: 16px; padding: 35px; backdrop-filter: blur(10px);">
      <form id="onboardingForm">

        <div style="margin-bottom: 20px;">
          <label style="display:block; margin-bottom: 8px; color: #C5A880; font-weight: 500;">Account / Client Type *</label>
          <select id="clientType" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            <option value="individual">Private Individual (Rent / Charter)</option>
            <option value="b2b_client">B2B Enterprise / Corporate Client</option>
            <option value="asset_owner">Asset Owner / Fleet Operator (List Asset)</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
          <div>
            <label style="display:block; margin-bottom: 8px; color: #C5A880; font-weight: 500;">Full Name *</label>
            <input type="text" id="fullName" required placeholder="e.g. Alexander Wright" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
          </div>
          <div>
            <label style="display:block; margin-bottom: 8px; color: #C5A880; font-weight: 500;">Email Address *</label>
            <input type="email" id="email" required placeholder="name@company.com" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
          <div>
            <label style="display:block; margin-bottom: 8px; color: #C5A880; font-weight: 500;">Phone / WhatsApp</label>
            <input type="tel" id="phone" placeholder="+31 6 12345678" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
          </div>
          <div>
            <label style="display:block; margin-bottom: 8px; color: #C5A880; font-weight: 500;">Company Name (Optional)</label>
            <input type="text" id="companyName" placeholder="e.g. Global Logistics B.V." style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display:block; margin-bottom: 8px; color: #C5A880; font-weight: 500;">Asset Category *</label>
          <select id="assetCategory" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            <option value="car">Luxury Cars & VIP Chauffeur</option>
            <option value="van">Commercial Vans & Sprinter Fleets</option>
            <option value="truck">Logistics Trucks & Commercial Vehicles</option>
            <option value="private_jet">Private Executive Jets</option>
            <option value="cargo_plane">Cargo Planes & Air Freight</option>
            <option value="yacht">Luxury Motor Yachts</option>
            <option value="real_estate">Prime Real Estate Estates</option>
          </select>
        </div>

        <div style="margin-bottom: 25px;">
          <label style="display:block; margin-bottom: 8px; color: #C5A880; font-weight: 500;">Rental / Lease Details & Dates</label>
          <textarea id="details" rows="4" placeholder="Specify your desired rental dates, location, fleet volume, or specific requirements..." style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px; resize: vertical;"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; padding: 15px; font-size: 1.05rem; font-weight: 600; text-transform: uppercase;">Submit Intake Request</button>
        
        <div id="formResponse" style="margin-top: 15px; font-weight: 600; text-align: center; font-size: 0.95rem;"></div>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 HABACHA Platform. Universal Exchange for Asset Charters, Rentals & Leasing.</p>
  </footer>

  <script src="js/supabase-client.js"></script>
  <script>
    document.getElementById('onboardingForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const responseDiv = document.getElementById('formResponse');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Transmitting to Supabase...';
      responseDiv.style.color = '#C5A880';
      responseDiv.textContent = 'Connecting to Supabase live database...';

      const payload = {
        client_name: document.getElementById('fullName').value,
        client_email: document.getElementById('email').value,
        client_phone: document.getElementById('phone').value,
        client_type: document.getElementById('clientType').value,
        company_name: document.getElementById('companyName').value,
        message: `[Category: ${document.getElementById('assetCategory').value}] ${document.getElementById('details').value}`,
        status: 'pending'
      };

      const res = await window.habachaDB.submitInquiry(payload);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Intake Request';

      if (res.success) {
        responseDiv.style.color = '#22C55E';
        responseDiv.innerHTML = '✅ <strong>SUCCESS!</strong> Your request has been stored directly in the live Supabase table [inquiries].';
        document.getElementById('onboardingForm').reset();
      } else {
        responseDiv.style.color = '#EF4444';
        responseDiv.innerHTML = '❌ <strong>Submission Alert:</strong> ' + (res.message || 'Failed to submit. Please verify API Key.');
      }
    });
  </script>

</body>
</html>
