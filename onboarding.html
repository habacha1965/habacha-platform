<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Onboarding & Rental Inquiry | HABACHA Platform</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo-container"><a href="index.html" class="logo-text">HABACHA</a></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="inventory.html">Browse Assets</a>
      <a href="onboarding.html" class="active">Rent / Charter</a>
      <a href="suppliers.html">Suppliers (B2B)</a>
    </nav>
  </header>

  <div class="container" style="max-width: 900px; margin: 50px auto; padding: 0 20px;">
    <div class="hero-text" style="text-align: center; margin-bottom: 40px;">
      <h1>Universal Charter & Rental Intake</h1>
      <p style="color: #94A3B8; font-size: 1.1rem; margin-top: 10px;">Select your asset class below to configure your precise itinerary and logistics.</p>
    </div>

    <div style="background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(197, 168, 128, 0.2); border-radius: 16px; padding: 35px; backdrop-filter: blur(10px);">
      <form id="onboardingForm">
        <!-- Identity -->
        <h3 style="color: #C5A880; border-bottom: 1px solid rgba(197,168,128,0.2); padding-bottom: 10px; margin-top: 0;">1. Client Profile</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
          <div><label style="display:block; margin-bottom: 8px; color: #fff;">Full Name *</label><input type="text" id="fullName" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;"></div>
          <div><label style="display:block; margin-bottom: 8px; color: #fff;">Email Address *</label><input type="email" id="email" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;"></div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
          <div><label style="display:block; margin-bottom: 8px; color: #fff;">Phone / WhatsApp *</label><input type="tel" id="phone" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;"></div>
          <div><label style="display:block; margin-bottom: 8px; color: #fff;">Company (Optional)</label><input type="text" id="companyName" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;"></div>
        </div>

        <!-- Asset Selection -->
        <h3 style="color: #C5A880; border-bottom: 1px solid rgba(197,168,128,0.2); padding-bottom: 10px; margin-top: 30px;">2. Asset Category</h3>
        <div style="margin-bottom: 20px;">
          <select id="assetCategory" onchange="renderLogisticsFields()" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid #C5A880; color: #fff; border-radius: 8px; font-size: 1rem;">
            <option value="car">Luxury Cars & VIP Transport</option>
            <option value="private_jet">Private Executive Jets</option>
            <option value="yacht">Luxury Motor Yachts</option>
            <option value="cargo">Commercial Trucks & Air Freight</option>
          </select>
        </div>

        <!-- Dynamic Specs -->
        <h3 style="color: #C5A880; border-bottom: 1px solid rgba(197,168,128,0.2); padding-bottom: 10px; margin-top: 30px;">3. Logistical Itinerary</h3>
        <div id="dynamicLogisticsContainer"></div>

        <div style="margin-bottom: 25px; margin-top: 20px;">
          <label style="display:block; margin-bottom: 8px; color: #fff;">Specific Requests / Preferences</label>
          <textarea id="messageNotes" rows="3" placeholder="Dietary requirements on board, specific vehicle model preference, etc..." style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px; resize: vertical;"></textarea>
        </div>

        <!-- Document Upload -->
        <h3 style="color: #C5A880; border-bottom: 1px solid rgba(197,168,128,0.2); padding-bottom: 10px; margin-top: 30px;">4. KYC / Passport Upload (Recommended)</h3>
        <div style="margin-bottom: 25px;">
          <input type="file" id="idDocFile" accept="image/*,application/pdf" style="width: 100%; padding: 10px; background: #0F172A; border: 1px dashed rgba(197,168,128,0.4); color: #fff; border-radius: 8px;">
        </div>

        <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 600; text-transform: uppercase;">Submit Secure Request</button>
        <div id="formResponse" style="margin-top: 20px; font-weight: 600; text-align: center;"></div>
      </form>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script>
    function renderLogisticsFields() {
      const cat = document.getElementById('assetCategory').value;
      const container = document.getElementById('dynamicLogisticsContainer');

      if (cat === 'private_jet') {
        container.innerHTML = `
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Routing Type *</label>
              <select id="jetRouting" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
                <option value="one_way">One-Way</option>
                <option value="round_trip">Round Trip</option>
                <option value="multi_leg">Multi-Leg</option>
              </select>
            </div>
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Passenger Count (Pax) *</label>
              <input type="number" id="jetPax" min="1" max="50" required placeholder="e.g. 6" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Origin Airport (ICAO / City) *</label>
              <input type="text" id="pickupLoc" required placeholder="e.g. London Farnborough (EGLF)" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Destination Airport (ICAO / City) *</label>
              <input type="text" id="dropoffLoc" required placeholder="e.g. Dubai Al Maktoum (OMDW)" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Departure Date & Time *</label>
              <input type="datetime-local" id="pickupDate" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Return Date (If applicable)</label>
              <input type="datetime-local" id="returnDate" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
          </div>
        `;
      } else if (cat === 'yacht') {
        container.innerHTML = `
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Cruising Region *</label>
              <select id="yachtRegion" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
                <option value="mediterranean">Mediterranean (Monaco, Italy, Greece)</option>
                <option value="caribbean">Caribbean & Bahamas</option>
                <option value="middle_east">Middle East (Dubai, Abu Dhabi)</option>
              </select>
            </div>
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Number of Guests *</label>
              <input type="number" id="yachtGuests" min="1" max="100" required placeholder="e.g. 10 Guests" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Embarkation Port *</label>
              <input type="text" id="pickupLoc" required placeholder="e.g. Port Hercules" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Disembarkation Port *</label>
              <input type="text" id="dropoffLoc" required placeholder="e.g. Capri Marina" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Charter Start Date *</label>
              <input type="date" id="pickupDate" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Charter End Date *</label>
              <input type="date" id="returnDate" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Service Type *</label>
              <select id="carService" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
                <option value="self_drive">Self-Drive (Bareboat)</option>
                <option value="chauffeur">Executive Chauffeur / Driver</option>
              </select>
            </div>
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Vehicle Class *</label>
              <select id="carClass" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
                <option value="luxury_sedan">Luxury Sedan (S-Class, Phantom)</option>
                <option value="suv">Premium SUV (G-Wagon, Range Rover)</option>
                <option value="sports">Sports / Supercar</option>
                <option value="van">Passenger Van (Sprinter, V-Class)</option>
              </select>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Pick-up Location *</label>
              <input type="text" id="pickupLoc" required placeholder="e.g. AMS Airport / Hotel Name" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Drop-off Location *</label>
              <input type="text" id="dropoffLoc" required placeholder="Same as Pick-up or specify" style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Pick-up Date & Time *</label>
              <input type="datetime-local" id="pickupDate" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
            <div>
              <label style="display:block; margin-bottom: 8px; color: #94A3B8;">Return Date & Time *</label>
              <input type="datetime-local" id="returnDate" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;">
            </div>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', renderLogisticsFields);

    document.getElementById('onboardingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const resDiv = document.getElementById('formResponse');

      btn.disabled = true;
      btn.textContent = 'Authenticating & Submitting...';
      resDiv.style.color = '#C5A880';
      resDiv.textContent = 'Processing request...';

      let docUrl = null;
      const fileIn = document.getElementById('idDocFile');
      if (fileIn.files.length > 0) {
        docUrl = await window.habachaDB.uploadFile('habacha_docs', fileIn.files[0]);
      }

      const logData = {
        pickup_location: document.getElementById('pickupLoc') ? document.getElementById('pickupLoc').value : '',
        dropoff_location: document.getElementById('dropoffLoc') ? document.getElementById('dropoffLoc').value : '',
        pickup_date: document.getElementById('pickupDate') ? document.getElementById('pickupDate').value : '',
        return_date: document.getElementById('returnDate') ? document.getElementById('returnDate').value : ''
      };

      const payload = {
        client_name: document.getElementById('fullName').value,
        client_email: document.getElementById('email').value,
        client_phone: document.getElementById('phone').value,
        client_type: 'individual',
        company_name: document.getElementById('companyName').value,
        message: `[${document.getElementById('assetCategory').value}] ${document.getElementById('messageNotes').value}`,
        logistics_data: logData,
        document_urls: docUrl ? [docUrl] : [],
        status: 'pending'
      };

      const res = await window.habachaDB.submitInquiry(payload);
      if (res.success) {
        window.location.href = 'success.html';
      } else {
        btn.disabled = false;
        btn.textContent = 'Submit Secure Request';
        resDiv.style.color = '#EF4444';
        resDiv.innerHTML = '❌ Error: ' + res.message;
      }
    });
  </script>
</body>
</html>
