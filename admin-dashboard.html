<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | HABACHA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">

    <!-- LOGIN SCHERM (Wordt verborgen na inloggen) -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center border border-slate-200">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold mb-2">Admin Access</h1>
            <p class="text-slate-500 text-sm mb-6">Enter your secure PIN to access the command center.</p>
            <input type="password" id="pin-input" class="w-full h-12 px-4 border border-slate-300 rounded-xl mb-4 text-center tracking-widest text-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
            <button id="login-btn" class="w-full h-12 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition">Enter Dashboard</button>
            <p id="login-error" class="text-red-500 text-sm mt-3 hidden">Incorrect PIN. Try again.</p>
        </div>
    </div>

    <!-- DASHBOARD SCHERM (Wordt getoond na inloggen) -->
    <div id="dashboard-screen" class="hidden">
        <!-- Top Bar -->
        <header class="bg-slate-900 text-white py-4 px-8 flex justify-between items-center shadow-md">
            <div class="flex items-center gap-3">
                <span class="font-bold text-xl tracking-wider text-white">HABACHA</span>
                <span class="px-2 py-1 bg-blue-600 text-xs font-bold rounded uppercase tracking-wide">Admin</span>
            </div>
            <button id="logout-btn" class="text-sm font-semibold text-slate-300 hover:text-white transition">Log Out</button>
        </header>

        <main class="max-w-7xl mx-auto px-6 py-10">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-1">Total Client Leads</p>
                    <p id="total-leads" class="text-4xl font-bold text-slate-900">0</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-1">Registered Suppliers</p>
                    <p id="total-suppliers" class="text-4xl font-bold text-blue-600">0</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-1">Founding Discounts Used</p>
                    <p id="total-discounts" class="text-4xl font-bold text-green-600">0</p>
                </div>
            </div>

            <!-- Tabs -->
            <div class="flex gap-4 mb-6 border-b border-slate-200">
                <button id="tab-leads" class="px-4 py-3 font-semibold text-blue-600 border-b-2 border-blue-600">Client Leads (HB Codes)</button>
                <button id="tab-suppliers" class="px-4 py-3 font-semibold text-slate-500 hover:text-slate-800">Registered Suppliers</button>
            </div>

            <!-- Leads Table -->
            <div id="table-leads" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="py-4 px-6 text-sm font-semibold text-slate-600">Date</th>
                            <th class="py-4 px-6 text-sm font-semibold text-slate-600">Tracking Code</th>
                            <th class="py-4 px-6 text-sm font-semibold text-slate-600">Client Name</th>
                            <th class="py-4 px-6 text-sm font-semibold text-slate-600">Client Email</th>
                            <th class="py-4 px-6 text-sm font-semibold text-slate-600">Status</th>
                        </tr>
                    </thead>
                    <tbody id="leads-body" class="divide-y divide-slate-100">
                        <!-- Wordt gevuld door JS -->
                    </tbody>
                </table>
            </div>

            <!-- Suppliers Table -->
            <div id="table-suppliers" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="py-4 px-6 text-sm font-semibold text-slate-600">Date</th>
                            <th class="py-4 px-6 text-sm font-semibold text-slate-600">Company</th>
                            <th class="py-4 px-6 text-sm font-semibold text-slate-600">Email</th>
                            <th class="py-4 px-6 text-sm font-semibold text-slate-600">Division</th>
                            <th class="py-4 px-6 text-sm font-semibold text-slate-600">Contract Link</th>
                        </tr>
                    </thead>
                    <tbody id="suppliers-body" class="divide-y divide-slate-100">
                        <!-- Wordt gevuld door JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- SUPABASE LOGICA -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        
        const supabaseUrl = 'https://fwiyrtchfbjpwrbvzynb.supabase.co';
        const supabaseKey = 'sb_publishable_rej1BmE3pLsiHB2fOrrGqA_IkcGBCX5';
        const supabase = createClient(supabaseUrl, supabaseKey);

        // --- LOGIN LOGICA ---
        const ADMIN_PIN = 'HABACHA2026'; // <-- Verander dit naar jouw eigen veilige code

        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const loginBtn = document.getElementById('login-btn');
        const pinInput = document.getElementById('pin-input');
        const loginError = document.getElementById('login-error');

        // Check of al ingelogd (via sessionStorage)
        if (sessionStorage.getItem('isAdmin') === 'true') {
            loginScreen.classList.add('hidden');
            dashboardScreen.classList.remove('hidden');
            loadData();
        }

        loginBtn.addEventListener('click', () => {
            if (pinInput.value === ADMIN_PIN) {
                sessionStorage.setItem('isAdmin', 'true');
                loginScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                loadData();
            } else {
                loginError.classList.remove('hidden');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            sessionStorage.removeItem('isAdmin');
            window.location.reload();
        });

        // --- TABS LOGICA ---
        const tabLeads = document.getElementById('tab-leads');
        const tabSuppliers = document.getElementById('tab-suppliers');
        const tableLeads = document.getElementById('table-leads');
        const tableSuppliers = document.getElementById('table-suppliers');

        tabLeads.addEventListener('click', () => {
            tabLeads.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            tabLeads.classList.remove('text-slate-500');
            tabSuppliers.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
            tabSuppliers.classList.add('text-slate-500');
            tableLeads.classList.remove('hidden');
            tableSuppliers.classList.add('hidden');
        });

        tabSuppliers.addEventListener('click', () => {
            tabSuppliers.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            tabSuppliers.classList.remove('text-slate-500');
            tabLeads.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
            tabLeads.classList.add('text-slate-500');
            tableSuppliers.classList.remove('hidden');
            tableLeads.classList.add('hidden');
        });

        // --- DATA LADEN ---
        async function loadData() {
            // 1. Laad Leads
            const { data: leads, error: leadsError } = await supabase
                .from('referrals')
                .select('*')
                .order('created_at', { ascending: false });

            if (!leadsError && leads) {
                document.getElementById('total-leads').innerText = leads.length;
                const tbody = document.getElementById('leads-body');
                tbody.innerHTML = '';
                leads.forEach(lead => {
                    const date = new Date(lead.created_at).toLocaleDateString();
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50">
                            <td class="py-4 px-6 text-sm text-slate-500">${date}</td>
                            <td class="py-4 px-6"><span class="px-2 py-1 bg-blue-100 text-blue-700 font-mono font-bold text-sm rounded">${lead.reference_code}</span></td>
                            <td class="py-4 px-6 text-sm font-medium text-slate-900">${lead.client_name}</td>
                            <td class="py-4 px-6 text-sm text-slate-500">${lead.client_email}</td>
                            <td class="py-4 px-6"><span class="px-2 py-1 bg-yellow-100 text-yellow-700 text-xs font-bold rounded uppercase">${lead.status || 'Pending'}</span></td>
                        </tr>
                    `;
                });
            }

            // 2. Laad Aanbieders
            const { data: suppliers, error: supError } = await supabase
                .from('suppliers')
                .select('*')
                .order('created_at', { ascending: false });

            if (!supError && suppliers) {
                document.getElementById('total-suppliers').innerText = suppliers.length;
                const tbody = document.getElementById('suppliers-body');
                tbody.innerHTML = '';
                suppliers.forEach(sup => {
                    const date = new Date(sup.created_at).toLocaleDateString();
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50">
                            <td class="py-4 px-6 text-sm text-slate-500">${date}</td>
                            <td class="py-4 px-6 text-sm font-medium text-slate-900">${sup.company_name}</td>
                            <td class="py-4 px-6 text-sm text-slate-500">${sup.contact_email}</td>
                            <td class="py-4 px-6"><span class="px-2 py-1 bg-slate-100 text-slate-700 text-xs font-bold rounded uppercase">${sup.category}</span></td>
                            <td class="py-4 px-6 text-sm text-blue-500 truncate max-w-xs"><a href="${sup.contract_link}" target="_blank">${sup.contract_link}</a></td>
                        </tr>
                    `;
                });
            }
        }
    </script>
</body>
</html>
