<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Access | HABACHA Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0b1329', 800: '#0f172a', 700: '#1e293b' },
                        steel: '#2563eb',
                        cyan: '#0ea5e9'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b1329; color: #f8fafc; font-family: -apple-system, sans-serif; text-align: left; }
    </style>
</head>
<body class="bg-navy-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="bg-navy-900 border-b border-slate-800 py-4 px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-steel to-cyan flex items-center justify-center font-black text-white text-lg">H</div>
                <span class="text-xl font-bold text-white">HABACHA</span>
            </a>
            <a href="inventory.html" class="text-xs text-slate-400 hover:text-white">Browse Marketplace &rarr;</a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-navy-800 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl flex flex-col items-start text-left">
            
            <div class="w-full mb-6">
                <h1 class="text-2xl font-bold text-white">Platform Portal Access</h1>
                <p class="text-xs text-slate-400 mt-1">Select your account role to sign in</p>
            </div>

            <!-- ROLE TABS -->
            <div class="flex p-1 bg-navy-900 rounded-lg border border-slate-700 mb-6 w-full">
                <button type="button" id="tabRenter" class="flex-1 py-2 text-xs font-bold rounded-md bg-steel text-white transition">Client / Renter</button>
                <button type="button" id="tabSupplier" class="flex-1 py-2 text-xs font-bold rounded-md text-slate-400 hover:text-white transition">Asset Supplier</button>
            </div>

            <form class="space-y-4 w-full">
                <div class="flex flex-col items-start">
                    <label class="block text-xs font-bold text-slate-300 mb-1">Email Address</label>
                    <input type="email" required placeholder="name@company.com" class="w-full px-4 py-2.5 rounded-lg bg-navy-900 text-white border border-slate-700 text-sm focus:outline-none focus:border-cyan">
                </div>
                
                <!-- DYNAMIC SUPPLIER FIELD -->
                <div id="supplierIdField" class="hidden flex-col items-start w-full transition-all">
                    <label class="block text-xs font-bold text-slate-300 mb-1 text-cyan">Supplier Portal ID *</label>
                    <input type="text" placeholder="e.g. SUP-9982" class="w-full px-4 py-2.5 rounded-lg bg-navy-900 text-white border border-slate-700 text-sm focus:outline-none focus:border-cyan">
                </div>

                <div class="flex flex-col items-start">
                    <label class="block text-xs font-bold text-slate-300 mb-1">Password</label>
                    <input type="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg bg-navy-900 text-white border border-slate-700 text-sm focus:outline-none focus:border-cyan">
                </div>
                
                <button type="submit" class="w-full py-3 px-4 rounded-lg bg-steel hover:bg-blue-600 text-white font-bold text-sm shadow-lg shadow-steel/30 transition mt-2">
                    Sign In to Dashboard
                </button>
            </form>

            <!-- DUAL REGISTRATION LINKS -->
            <div class="mt-6 w-full text-center text-xs text-slate-400 border-t border-slate-700/60 pt-4 flex flex-col space-y-2">
                <div>Don't have a Client account? <a href="register.html" class="text-cyan font-bold hover:underline">Create Free Renter Account</a></div>
                <div>Are you an asset owner? <a href="supplier-register.html" class="text-slate-300 font-bold hover:underline">Register Fleet</a></div>
            </div>

        </div>
    </main>

    <footer class="bg-navy-950 border-t border-slate-800 text-slate-500 text-xs py-4 text-center">
        &copy; HABACHA Platform. All rights reserved.
    </footer>

    <script>
        const tabRenter = document.getElementById('tabRenter');
        const tabSupplier = document.getElementById('tabSupplier');
        const supplierIdField = document.getElementById('supplierIdField');

        tabRenter.addEventListener('click', () => {
            tabRenter.className = "flex-1 py-2 text-xs font-bold rounded-md bg-steel text-white transition";
            tabSupplier.className = "flex-1 py-2 text-xs font-bold rounded-md text-slate-400 hover:text-white transition";
            supplierIdField.classList.add('hidden');
            supplierIdField.classList.remove('flex');
            supplierIdField.querySelector('input').removeAttribute('required');
        });

        tabSupplier.addEventListener('click', () => {
            tabSupplier.className = "flex-1 py-2 text-xs font-bold rounded-md bg-steel text-white transition";
            tabRenter.className = "flex-1 py-2 text-xs font-bold rounded-md text-slate-400 hover:text-white transition";
            supplierIdField.classList.remove('hidden');
            supplierIdField.classList.add('flex');
            supplierIdField.querySelector('input').setAttribute('required', 'true');
        });
    </script>
</body>
</html>
