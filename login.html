<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal | HABACHA Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b1329;
            --bg-card: #152243;
            --primary: #2563eb;
            --accent-cyan: #0ea5e9;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

        .auth-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 450px; padding: 35px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .logo { text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; color: #fff; }

        .role-switch { display: flex; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 4px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .role-btn { flex: 1; background: none; border: none; color: var(--text-muted); padding: 10px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.3s; }
        .role-btn.active { background: var(--primary); color: #fff; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 12px; border-radius: 8px; font-size: 0.95rem; outline: none; }

        .btn-auth { background: var(--primary); color: #fff; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 10px; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted); }
        .auth-footer a { color: var(--accent-cyan); text-decoration: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo"><i class="fa-solid fa-cubes"></i> HABACHA PLATFORM</div>

        <div class="role-switch">
            <button class="role-btn active" id="btn-client" onclick="selectRole('client')"><i class="fa-solid fa-user"></i> Client / Renter</button>
            <button class="role-btn" id="btn-supplier" onclick="selectRole('supplier')"><i class="fa-solid fa-handshake"></i> Asset Supplier</button>
        </div>

        <h3 id="auth-title" style="font-size: 1.1rem; color: #fff; margin-bottom: 15px; text-align: center;">Client Login</h3>

        <form onsubmit="executeLogin(event)">
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-auth"><i class="fa-solid fa-right-to-bracket"></i> Login to Portal</button>
        </form>

        <div class="auth-footer">
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script>
        let selectedRole = 'client';

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('btn-client').classList.toggle('active', role === 'client');
            document.getElementById('btn-supplier').classList.toggle('active', role === 'supplier');
            document.getElementById('auth-title').innerText = role === 'client' ? 'Client Login' : 'Asset Supplier Login';
        }

        function executeLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            localStorage.setItem('habacha_user_session', JSON.stringify({ email, role: selectedRole }));
            window.location.href = 'inventory.html';
        }
    </script>
</body>
</html>
