<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | HABACHA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-dark: #0b132b; --bg-card: #1c2541; --gold: #c5a059; }
        body { background-color: var(--bg-dark); color: #fff; font-family: 'Segoe UI', sans-serif; }
        .text-gold { color: var(--gold) !important; }
        .bg-gold { background-color: var(--gold) !important; color: #000 !important; }
        .nav-link { color: #fff; font-weight: 500; }
        .nav-link:hover, .nav-link.active { color: var(--gold); }
        .asset-card { background: var(--bg-card); border: 1px solid rgba(197,160,89,0.2); border-radius: 12px; overflow: hidden; transition: 0.3s; }
        .asset-card:hover { transform: translateY(-5px); border-color: var(--gold); }
        .asset-img { height: 220px; object-fit: cover; width: 100%; }
        .btn-filter { border: 1px solid var(--gold); color: var(--gold); background: transparent; }
        .btn-filter.active, .btn-filter:hover { background: var(--gold); color: #000; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg border-bottom border-secondary py-3">
        <div class="container">
            <a class="navbar-brand text-gold fw-bold fs-3" href="index.html">HABACHA</a>
            <div class="navbar-nav ms-auto gap-3">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link active" href="inventory.html">Marketplace</a>
                <a class="nav-link" href="admin.html">Admin</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-5 text-gold fw-bold">Executive Asset Exchange</h1>
            <p class="text-secondary lead">Select an asset to begin your charter request.</p>
            <div class="d-flex justify-content-center gap-2 mt-4" id="filters">
                <button class="btn btn-filter active" onclick="filter('All')">All</button>
                <button class="btn btn-filter" onclick="filter('Aviation')">Aviation</button>
                <button class="btn btn-filter" onclick="filter('Road Transport')">Road</button>
                <button class="btn btn-filter" onclick="filter('Maritime')">Maritime</button>
                <button class="btn btn-filter" onclick="filter('Real Estate')">Real Estate</button>
            </div>
        </div>
        <div class="row g-4" id="grid"></div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="bookModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background:var(--bg-card); border:1px solid var(--gold);">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-gold" id="modalTitle">Charter Request</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="bookForm" onsubmit="processBooking(event)">
                        <input type="hidden" id="aTitle">
                        <input type="hidden" id="aCat">
                        <input type="hidden" id="aRate">
                        
                        <input type="text" id="cName" class="form-control bg-dark text-white border-secondary mb-3" required placeholder="Full Name">
                        <input type="email" id="cEmail" class="form-control bg-dark text-white border-secondary mb-3" required placeholder="Email Address">
                        <input type="tel" id="cPhone" class="form-control bg-dark text-white border-secondary mb-3" required placeholder="Phone Number">
                        
                        <div class="row g-2 mb-3">
                            <div class="col-6"><input type="date" id="cDate" class="form-control bg-dark text-white border-secondary" required></div>
                            <div class="col-6"><input type="number" id="cUnits" class="form-control bg-dark text-white border-secondary" min="1" value="1" oninput="calc()" required placeholder="Duration"></div>
                        </div>
                        
                        <div class="d-flex justify-content-between p-3 bg-dark rounded border-warning mb-3">
                            <span>Total Estimate:</span>
                            <span class="fs-4 fw-bold text-gold" id="cTotal">€0</span>
                        </div>
                        <button type="submit" id="btnSubmit" class="btn bg-gold w-100 fw-bold py-2">Confirm Request</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/supabase-client.js"></script>
    <script>
        const fallbackFleet = [
            { title: "Gulfstream G650ER", cat: "Aviation", rate: 14500, type: "hour", img: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=800&q=80" },
            { title: "Rolls-Royce Cullinan", cat: "Road Transport", rate: 2200, type: "day", img: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=800&q=80" },
            { title: "Sunseeker 131 Yacht", cat: "Maritime", rate: 18500, type: "day", img: "https://images.unsplash.com/photo-1569263979104-865ab7cd8d13?auto=format&fit=crop&w=800&q=80" },
            { title: "Villa Superieure", cat: "Real Estate", rate: 8500, type: "day", img: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80" }
        ];

        let assets = fallbackFleet;

        async function init() {
            try {
                const res = await fetch(SUPABASE_URL + '/rest/v1/assets?select=*', {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
                });
                if(res.ok) {
                    const data = await res.json();
                    if(data.length > 0) assets = data;
                }
            } catch(e) { console.warn("DB offline, using failsafe assets."); }
            render(assets);
        }

        function render(data) {
            document.getElementById('grid').innerHTML = data.map(a => `
                <div class="col-md-6 col-lg-3">
                    <div class="asset-card h-100 d-flex flex-column">
                        <img src="${a.image_url || a.img}" class="asset-img" alt="${a.title}">
                        <div class="p-3 d-flex flex-column flex-grow-1">
                            <span class="badge bg-gold align-self-start mb-2">${a.category || a.cat}</span>
                            <h5 class="fw-bold">${a.title}</h5>
                            <div class="mt-auto pt-3">
                                <h4 class="text-gold mb-3">€${(a.daily_rate || a.rate).toLocaleString()}<small class="fs-6 text-secondary">/${a.rate_type || a.type}</small></h4>
                                <button onclick="openModal('${a.title}', '${a.category || a.cat}', ${a.daily_rate || a.rate})" class="btn bg-gold w-100 fw-bold">Select</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filter(c) {
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            render(c === 'All' ? assets : assets.filter(a => (a.category || a.cat) === c));
        }

        function openModal(title, cat, rate) {
            document.getElementById('aTitle').value = title;
            document.getElementById('aCat').value = cat;
            document.getElementById('aRate').value = rate;
            document.getElementById('modalTitle').innerText = 'Request: ' + title;
            calc();
            new bootstrap.Modal(document.getElementById('bookModal')).show();
        }

        function calc() {
            const r = parseFloat(document.getElementById('aRate').value);
            const u = parseFloat(document.getElementById('cUnits').value || 1);
            document.getElementById('cTotal').innerText = '€' + (r * u).toLocaleString();
        }

        async function processBooking(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true; btn.innerText = "Processing...";

            const data = {
                name: document.getElementById('cName').value,
                email: document.getElementById('cEmail').value,
                phone: document.getElementById('cPhone').value,
                title: document.getElementById('aTitle').value,
                cat: document.getElementById('aCat').value,
                date: document.getElementById('cDate').value,
                units: document.getElementById('cUnits').value,
                total: document.getElementById('cTotal').innerText
            };

            const manifest = `Asset: ${data.title}\nDate: ${data.date}\nDuration: ${data.units}\nTotal: ${data.total}\nPhone: ${data.phone}`;

            try {
                await fetch(SUPABASE_URL + '/rest/v1/inquiries', {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name: data.name, email: data.email, phone: data.phone, asset_category: data.cat, logistics_data: manifest })
                });
            } catch(e) { console.log('DB log skipped'); }

            const adminEmail = localStorage.getItem('admin_email_address') || data.email;
            
            console.log("Dispatching secure emails...");
            await Promise.all([
                dispatchResendEmail(data.email, "Booking Confirmation", generateClientEmail(data.name, data.cat, manifest)),
                dispatchResendEmail(adminEmail, "🚨 New Booking Alert", generateAdminEmail(data.name, data.email, data.cat, manifest))
            ]);

            window.location.href = "success.html";
        }

        init();
    </script>
</body>
</html>
