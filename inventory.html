<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Marketplace | HABACHA Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b1329;
            --bg-card: #152243;
            --primary: #2563eb;
            --accent-cyan: #0ea5e9;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); }
        
        header { background: #060b18; border-bottom: 1px solid var(--border-color); padding: 16px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        
        .container { padding: 40px 5%; max-width: 1300px; margin: 0 auto; }
        
        .filter-bar { display: flex; gap: 12px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 10px; }
        .filter-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .filter-btn.active, .filter-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
        
        .assets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        .card:hover { border-color: var(--primary); transform: translateY(-4px); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
        .card-specs { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
        .card-price { font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 16px; }
        
        .btn-view-product { background: var(--primary); color: #fff; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 700; text-align: center; display: block; transition: 0.3s; }
        .btn-view-product:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><i class="fa-solid fa-cubes"></i> HABACHA Platform</a>
        <div>
            <a href="login.html" style="color: var(--accent-cyan); text-decoration: none; font-weight: 600; margin-right: 20px;"><i class="fa-solid fa-user-lock"></i> Client / Supplier Login</a>
            <a href="index.html" style="color: var(--text-muted); text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Home</a>
        </div>
    </header>

    <div class="container">
        <h2 style="font-size: 2rem; margin-bottom: 20px;">Enterprise Asset Marketplace</h2>
        
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterCategory('all')">All Assets</button>
            <button class="filter-btn" onclick="filterCategory('aviation')"><i class="fa-solid fa-plane"></i> Private & Cargo Jets</button>
            <button class="filter-btn" onclick="filterCategory('maritime')"><i class="fa-solid fa-ship"></i> Cargo Ships & Yachts</button>
            <button class="filter-btn" onclick="filterCategory('logistics')"><i class="fa-solid fa-truck"></i> Heavy Cargo & Vans</button>
            <button class="filter-btn" onclick="filterCategory('realestate')"><i class="fa-solid fa-building"></i> Commercial Real Estate</button>
        </div>

        <div class="assets-grid" id="asset-container">
            <!-- Dynamic Assets Rendered Here -->
        </div>
    </div>

    <script>
        const inventoryData = [
            { id: '1', title: 'Gulfstream G650ER Jet', category: 'aviation', price: 9500, unit: 'per flight hour', image: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=600', specs: '14 Passengers | Range 7,500 NM | ARGUS Platinum' },
            { id: '2', title: 'Boeing 737-800 Cargo Freighter', category: 'aviation', price: 18500, unit: 'per flight hour', image: 'https://images.unsplash.com/photo-1519074069444-1ba4eff56022?w=600', specs: '23.9 Ton Payload | Main Deck Pallet Loading' },
            { id: '3', title: 'Panamax Bulk Cargo Carrier Vessel', category: 'maritime', price: 32000, unit: 'per charter day', image: 'https://images.unsplash.com/photo-1559136555-9303baea8ebd?w=600', specs: '4,500 TEU | Gross Tonnage 54,000 GT' },
            { id: '4', title: 'Sunseeker 131 Ocean Mega Yacht', category: 'maritime', price: 14000, unit: 'per day', image: 'https://images.unsplash.com/photo-1567899378494-47b22a2ae96a?w=600', specs: '12 Guests | 5 Cabins | Master Captain & Crew' },
            { id: '5', title: 'Volvo FH16 750 Heavy Freight Truck', category: 'logistics', price: 450, unit: 'per day', image: 'https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?w=600', specs: '44 Ton Payload | Keyless Mobile App Unlock' },
            { id: '7', title: 'Rotterdam Logistics Distribution Hub', category: 'realestate', price: 45000, unit: 'per month lease', image: 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=600', specs: '18,000 m² | 24 Hydraulic Docks | Escrow Clear' }
        ];

        function renderInventory(data) {
            const container = document.getElementById('asset-container');
            container.innerHTML = data.map(asset => `
                <div class="card">
                    <img src="${asset.image}" alt="${asset.title}">
                    <div class="card-content">
                        <div>
                            <div class="card-title">${asset.title}</div>
                            <div class="card-specs">${asset.specs}</div>
                        </div>
                        <div>
                            <div class="card-price">€${asset.price.toLocaleString()} <span style="font-size:0.8rem; font-weight:400; color:var(--text-muted);">${asset.unit}</span></div>
                            <a href="asset-detail.html?id=${asset.id}" class="btn-view-product">View Full Specs & Reserve</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if (cat === 'all') renderInventory(inventoryData);
            else renderInventory(inventoryData.filter(a => a.category === cat));
        }

        renderInventory(inventoryData);
    </script>
</body>
</html>
