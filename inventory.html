<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Marketplace | HABACHA Platform</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; margin-top: 30px; }
    .card { background: #0F172A; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; }
    .card-img { height: 220px; background-color: #1E293B; background-size: cover; background-position: center; }
    .card-body { padding: 20px; }
    .card-title { color: #C5A880; font-size: 1.25rem; margin-bottom: 10px; }
    .card-price { color: #22C55E; font-size: 1.4rem; font-weight: bold; margin-bottom: 15px; }
    .card-spec { color: #94A3B8; font-size: 0.9rem; margin-bottom: 5px; }
    
    /* Checkout Modal Styles */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(2, 6, 23, 0.9); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-content { background: #0F172A; border: 1px solid #C5A880; border-radius: 16px; width: 100%; max-width: 600px; padding: 30px; max-height: 90vh; overflow-y: auto; }
    .close-btn { float: right; cursor: pointer; color: #94A3B8; font-size: 1.5rem; line-height: 1; }
    .close-btn:hover { color: #EF4444; }
    
    .checkout-summary { background: #1E293B; padding: 20px; border-radius: 8px; margin-bottom: 25px; border-left: 4px solid #C5A880; }
    .total-price-display { font-size: 1.8rem; color: #22C55E; font-weight: bold; margin-top: 15px; text-align: center; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 15px; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; color: #94A3B8; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 12px; background: #1E293B; border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <div class="logo-container"><a href="index.html" class="logo-text">HABACHA</a></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="inventory.html" class="active">Marketplace</a>
      <a href="suppliers.html">List Your Asset</a>
    </nav>
  </header>

  <div class="container" style="margin: 40px auto;">
    <h1 style="text-align: center; color: #C5A880;">Live Asset Inventory</h1>
    <div class="grid" id="inventoryGrid">
      <!-- Injected via JS -->
      <p style="text-align: center; width: 100%; color: #94A3B8;">Loading live marketplace data...</p>
    </div>
  </div>

  <!-- Booking Checkout Modal -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 style="color: #C5A880; margin-top: 0;">Secure Booking Request</h2>
      
      <div class="checkout-summary">
        <h3 id="modalAssetTitle" style="margin: 0 0 10px 0; color: #fff;">Asset Title</h3>
        <p id="modalAssetRate" style="margin: 0; color: #94A3B8; font-size: 1rem;">Rate: €0 / day</p>
      </div>

      <form id="checkoutForm">
        <input type="hidden" id="assetId">
        <input type="hidden" id="assetRate">
        <input type="hidden" id="assetRateType">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label>Start Date & Time</label>
            <input type="datetime-local" id="startDate" required onchange="calculateTotal()">
          </div>
          <div class="form-group">
            <label>End Date & Time</label>
            <input type="datetime-local" id="endDate" required onchange="calculateTotal()">
          </div>
        </div>

        <div class="total-price-display" id="totalPriceDisplay">
          Estimated Total: €0.00
        </div>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 25px 0;">
        <h3 style="color: #C5A880; margin-bottom: 15px;">Client Details</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="clientName" required>
          </div>
          <div class="form-group">
            <label>Email Address *</label>
            <input type="email" id="clientEmail" required>
          </div>
        </div>
        <div class="form-group">
          <label>Phone / WhatsApp *</label>
          <input type="tel" id="clientPhone" required>
        </div>
        <div class="form-group">
          <label>Specific Logistics / Routing Notes</label>
          <input type="text" id="clientNotes" placeholder="e.g. Need pickup at Schiphol Airport">
        </div>

        <button type="submit" id="submitBookingBtn" class="btn-primary" style="width: 100%; padding: 15px; margin-top: 10px;">Confirm & Request Booking</button>
        <div id="bookingResponse" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>
      </form>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script>
    let currentAssets = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const categoryFilter = urlParams.get('cat');
      
      const grid = document.getElementById('inventoryGrid');
      
      // Fetch assets from Supabase DB
      const res = await fetch(`${window.habachaDB.url}/rest/v1/assets?select=*&status=eq.available`, {
        headers: { 'apikey': window.habachaDB.getKey(), 'Authorization': `Bearer ${window.habachaDB.getKey()}` }
      });
      
      if (res.ok) {
        currentAssets = await res.json();
        let displayAssets = currentAssets;
        
        // Very basic mapping for demo (in production you map supplier categories to assets)
        if (categoryFilter === 'jet_aircraft') {
            displayAssets = currentAssets.filter(a => a.category === 'private_jet' || a.category === 'cargo_plane');
        } else if (categoryFilter === 'car_van_truck') {
            displayAssets = currentAssets.filter(a => a.category === 'car' || a.category === 'van' || a.category === 'truck');
        } else if (categoryFilter === 'yacht_ship') {
            displayAssets = currentAssets.filter(a => a.category === 'yacht');
        } else if (categoryFilter === 'real_estate') {
            displayAssets = currentAssets.filter(a => a.category === 'real_estate');
        }

        if (displayAssets.length === 0) {
          grid.innerHTML = '<p style="text-align:center; width:100%; color:#C5A880;">No assets currently available in this category.</p>';
          return;
        }

        grid.innerHTML = displayAssets.map(a => {
          // Check if rate is per day or per hour based on category
          const isHourly = (a.category === 'private_jet' || a.category === 'cargo_plane');
          const rate = isHourly ? a.rate_per_hour : a.rate_per_day;
          const rateLabel = isHourly ? '/ hour' : '/ day';
          const rateFormatted = rate ? `€${parseFloat(rate).toLocaleString()}` : 'Price on Request';
          const imgUrl = a.image_url || 'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&q=80';

          return `
            <div class="card">
              <div class="card-img" style="background-image: url('${imgUrl}')"></div>
              <div class="card-body">
                <h3 class="card-title">${a.title}</h3>
                <div class="card-price">${rateFormatted} <span style="font-size: 0.9rem; color: #94A3B8; font-weight: normal;">${rate ? rateLabel : ''}</span></div>
                <p class="card-spec"><strong>Location:</strong> ${a.location || 'Global'}</p>
                <p class="card-spec"><strong>Capacity:</strong> ${a.capacity || 'N/A'}</p>
                <button class="btn-primary" style="width: 100%; margin-top: 15px; padding: 12px;" onclick="openModal('${a.id}', '${a.title.replace(/'/g, "\'")}', ${rate || 0}, '${isHourly ? 'hour' : 'day'}')">Select & Book</button>
              </div>
            </div>
          `;
        }).join('');
      } else {
        grid.innerHTML = '<p style="color:#EF4444; text-align:center;">Failed to load marketplace inventory. Verify Database API Key.</p>';
      }
    });

    function openModal(id, title, rate, type) {
      document.getElementById('checkoutModal').style.display = 'flex';
      document.getElementById('assetId').value = id;
      document.getElementById('assetRate').value = rate;
      document.getElementById('assetRateType').value = type;
      
      document.getElementById('modalAssetTitle').textContent = title;
      document.getElementById('modalAssetRate').textContent = `Rate: €${parseFloat(rate).toLocaleString()} / ${type}`;
      
      // Reset form
      document.getElementById('startDate').value = '';
      document.getElementById('endDate').value = '';
      document.getElementById('totalPriceDisplay').textContent = 'Estimated Total: €0.00';
      document.getElementById('bookingResponse').textContent = '';
    }

    function closeModal() {
      document.getElementById('checkoutModal').style.display = 'none';
    }

    function calculateTotal() {
      const start = new Date(document.getElementById('startDate').value);
      const end = new Date(document.getElementById('endDate').value);
      const rate = parseFloat(document.getElementById('assetRate').value);
      const type = document.getElementById('assetRateType').value;
      const display = document.getElementById('totalPriceDisplay');

      if (!start || !end || isNaN(start) || isNaN(end) || start >= end || rate === 0) {
        display.textContent = 'Estimated Total: €0.00';
        return;
      }

      const diffMs = end - start;
      const diffHours = diffMs / (1000 * 60 * 60);
      const diffDays = diffHours / 24;

      let total = 0;
      if (type === 'hour') {
        total = diffHours * rate;
      } else {
        total = Math.ceil(diffDays) * rate; // round up to whole days
      }

      display.textContent = `Estimated Total: €${total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBookingBtn');
      const resDiv = document.getElementById('bookingResponse');
      
      btn.disabled = true;
      btn.textContent = 'Processing Booking...';

      const payload = {
        asset_id: document.getElementById('assetId').value || null,
        client_name: document.getElementById('clientName').value,
        client_email: document.getElementById('clientEmail').value,
        client_phone: document.getElementById('clientPhone').value,
        client_type: 'individual',
        start_date: document.getElementById('startDate').value,
        end_date: document.getElementById('endDate').value,
        message: `Total Price Accepted: ${document.getElementById('totalPriceDisplay').textContent} | Notes: ${document.getElementById('clientNotes').value}`,
        status: 'pending'
      };

      const res = await window.habachaDB.submitInquiry(payload);
      
      if (res.success) {
        window.location.href = 'success.html';
      } else {
        btn.disabled = false;
        btn.textContent = 'Confirm & Request Booking';
        resDiv.style.color = '#EF4444';
        resDiv.textContent = 'Error: ' + res.message;
      }
    });
  </script>
</body>
</html>
