<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details & Request | HABACHA Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <style>
        :root {
            --bg-main: #0b1329;
            --bg-card: #152243;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-cyan: #0ea5e9;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; }

        header { background: #060b18; border-bottom: 1px solid var(--border-color); padding: 16px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; }

        .container { max-width: 1250px; margin: 40px auto; padding: 0 5%; display: grid; grid-template-columns: 1fr 420px; gap: 40px; }
        
        .asset-tag { display: inline-flex; align-items: center; gap: 8px; background: rgba(14, 165, 233, 0.15); color: var(--accent-cyan); border: 1px solid rgba(14, 165, 233, 0.3); padding: 4px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
        .asset-title { font-size: 2.2rem; font-weight: 800; color: #fff; margin-bottom: 8px; }
        .asset-meta { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; display: flex; gap: 20px; }

        .gallery { width: 100%; height: 400px; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 30px; position: relative; }
        .gallery img { width: 100%; height: 100%; object-fit: cover; }
        .supplier-badge { position: absolute; bottom: 20px; left: 20px; background: rgba(11, 19, 41, 0.85); backdrop-filter: blur(8px); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; color: #fff; }

        .box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .box h4 { font-size: 1.05rem; color: #fff; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .spec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
        .spec-item label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
        .spec-item span { font-size: 0.95rem; color: #fff; font-weight: 600; }

        .sidebar { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 28px; position: sticky; top: 30px; }
        .price { font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .price span { font-size: 0.85rem; font-weight: 400; color: var(--text-muted); }

        .form-head { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-cyan); font-weight: 700; margin: 18px 0 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent-cyan); }

        .btn-submit { background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; width: 100%; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        .btn-submit:hover { background: var(--primary-hover); }

        /* Redirect Pop-up */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #0f172a; border: 1px solid var(--border-color); border-radius: 16px; padding: 35px; max-width: 500px; width: 100%; text-align: center; }
        .btn-redirect { background: #16a34a; color: #fff; text-decoration: none; padding: 14px 20px; border-radius: 8px; font-weight: 700; display: block; margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><i class="fa-solid fa-cubes"></i> HABACHA Platform</a>
        <a href="inventory.html" style="color: var(--text-muted); text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Back to Marketplace</a>
    </header>

    <div class="container" id="detail-container">
        <!-- Injected via JS -->
    </div>

    <!-- Redirect Modal -->
    <div class="modal" id="redirect-modal">
        <div class="modal-card">
            <i class="fa-solid fa-circle-check" style="font-size: 3rem; color: #16a34a; margin-bottom: 15px;"></i>
            <h3>Request Recorded Successfully!</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 10px;">Your details have been saved under HABACHA Referral Code: <strong id="ref-code" style="color:var(--accent-cyan);">HB-8921</strong>.</p>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 10px;">Click below to complete your booking directly on the supplier's website.</p>
            <a href="#" id="supplier-link" target="_blank" class="btn-redirect"><i class="fa-solid fa-arrow-up-right-from-square"></i> Continue to Supplier Web Booking</a>
        </div>
    </div>

    <script>
        const database = [
            {
                id: '1', title: 'Volkswagen Golf 8', category: 'cars', price: 65, unit: 'per day',
                image: 'https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?w=1200',
                location: 'Amsterdam Branch / Schiphol Airport', provider: 'CityDrive Car Rental B.V.',
                website: 'https://example.com/citydrive-booking',
                specs: { 'Transmission': 'Automatic', 'Engine': '1.5 TSI Petrol', 'Seats': '5 Persons', 'Fuel Standard': 'Full to Full' },
                description: 'Ideal car for daily driving, city trips, or business meetings. Flexible short rental or long-term private lease available.'
            },
            {
                id: '2', title: 'Mercedes-Benz Sprinter Cargo Van', category: 'logistics', price: 120, unit: 'per day',
                image: 'https://images.unsplash.com/photo-1559297434-fae8a1916a79?w=1200',
                location: 'Rotterdam Terminal / Delivery Address', provider: 'EuroExpress Fleet Services',
                website: 'https://example.com/sprinter-van',
                specs: { 'Cargo Volume': '14 m³ Volume', 'Payload Capacity': '1,200 kg', 'Driver License': 'Standard Category B', 'Features': 'Rear Camera & GPS' },
                description: 'Spacious delivery van equipped for moving house, transport of goods, or company parcel delivery.'
            }
        ];

        function renderDetails() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id') || '1';
            const item = database.find(i => i.id === id) || database[0];

            const specsHtml = Object.entries(item.specs).map(([k, v]) => `
                <div class="spec-item"><label>${k}</label><span>${v}</span></div>
            `).join('');

            document.getElementById('detail-container').innerHTML = `
                <div>
                    <span class="asset-tag"><i class="fa-solid fa-tag"></i> ${item.category.toUpperCase()} DIVISION</span>
                    <h1 class="asset-title">${item.title}</h1>
                    <div class="asset-meta">
                        <span><i class="fa-solid fa-location-dot" style="color:var(--accent-cyan)"></i> ${item.location}</span>
                    </div>

                    <div class="gallery">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="supplier-badge"><i class="fa-solid fa-shield-halved" style="color:var(--accent-cyan)"></i> Supplier: ${item.provider}</div>
                    </div>

                    <div class="box">
                        <h4>Specifications & Features</h4>
                        <div class="spec-grid">${specsHtml}</div>
                    </div>

                    <div class="box">
                        <h4>Description</h4>
                        <p style="color:var(--text-muted);">${item.description}</p>
                    </div>
                </div>

                <div>
                    <div class="sidebar">
                        <div class="price">€${item.price} <span>/ ${item.unit}</span></div>

                        <form onsubmit="submitLead(event, '${item.website}')">
                            <div class="form-head">1. Customer Type & Service</div>
                            <div class="form-group">
                                <label>Customer Type *</label>
                                <select id="client_type">
                                    <option value="private">Private Individual</option>
                                    <option value="business">Business / Company</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Agreement *</label>
                                <select id="service_type">
                                    <option value="rental">Short Rental (Days / Weeks)</option>
                                    <option value="lease">Long Lease (Months / Years)</option>
                                </select>
                            </div>

                            <div class="form-head">2. Your Contact Details</div>
                            <div class="form-group">
                                <label>Full Name *</label>
                                <input type="text" id="client_name" required placeholder="John Doe">
                            </div>
                            <div class="form-group">
                                <label>Email Address *</label>
                                <input type="email" id="client_email" required placeholder="john@example.com">
                            </div>
                            <div class="form-group">
                                <label>Phone / WhatsApp *</label>
                                <input type="tel" id="client_phone" required placeholder="+31 6 12345678">
                            </div>

                            <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Proceed to Supplier Website</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function submitLead(e, supplierUrl) {
            e.preventDefault();
            const refCode = 'HB-' + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('ref-code').innerText = refCode;
            document.getElementById('supplier-link').href = `${supplierUrl}?ref=${refCode}`;
            document.getElementById('redirect-modal').style.display = 'flex';
        }

        renderDetails();
    </script>
</body>
</html>
