<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Details & Operational Booking | HABACHA Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <style>
        :root {
            --bg-main: #0b1329;
            --bg-card: #152243;
            --bg-card-hover: #1c2b54;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-cyan: #0ea5e9;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; }

        /* Navigation Header */
        header { background: #060b18; border-bottom: 1px solid var(--border-color); padding: 16px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.4rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; }
        .logo span { background: rgba(37, 99, 235, 0.2); color: var(--accent-cyan); font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(14, 165, 233, 0.3); }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .nav-right a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .nav-right a:hover { color: #fff; }
        .user-badge { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; color: var(--accent-cyan); display: flex; align-items: center; gap: 8px; }

        /* Container */
        .container { max-width: 1300px; margin: 40px auto; padding: 0 5%; display: grid; grid-template-columns: 1fr 420px; gap: 40px; }
        
        /* Asset Detail Column */
        .asset-header-tag { display: inline-flex; align-items: center; gap: 8px; background: rgba(14, 165, 233, 0.15); color: var(--accent-cyan); border: 1px solid rgba(14, 165, 233, 0.3); padding: 4px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
        .asset-main-title { font-size: 2.4rem; font-weight: 800; color: #fff; margin-bottom: 8px; line-height: 1.2; }
        .asset-sub-info { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px; display: flex; gap: 20px; }

        .gallery-container { width: 100%; height: 420px; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 30px; position: relative; }
        .gallery-container img { width: 100%; height: 100%; object-fit: cover; }
        .verified-stamp { position: absolute; bottom: 20px; left: 20px; background: rgba(11, 19, 41, 0.85); backdrop-filter: blur(8px); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }

        .spec-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 30px; }
        .spec-box h4 { font-size: 1.1rem; color: #fff; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .spec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
        .spec-item label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
        .spec-item span { font-size: 0.95rem; color: #fff; font-weight: 600; }

        /* Booking Form Column */
        .booking-sidebar { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; position: sticky; top: 100px; }
        .rate-display { font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .rate-display span { font-size: 0.85rem; font-weight: 400; color: var(--text-muted); }
        .escrow-notice { font-size: 0.8rem; color: var(--accent-cyan); margin-bottom: 24px; display: flex; align-items: center; gap: 6px; }

        .form-section-head { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-cyan); font-weight: 700; margin: 20px 0 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 12px; border-radius: 8px; font-size: 0.9rem; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent-cyan); }

        .btn-reserve { background: var(--primary); color: #fff; border: none; padding: 16px; border-radius: 8px; font-weight: 700; font-size: 1rem; width: 100%; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        .btn-reserve:hover { background: var(--primary-hover); box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4); }

        /* Login Gate Modal */
        .login-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: #0f172a; border: 1px solid var(--border-color); border-radius: 16px; padding: 35px; max-width: 450px; width: 100%; text-align: center; }
        .login-card h3 { font-size: 1.5rem; color: #fff; margin-bottom: 10px; }
        .login-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }
        .btn-modal-login { background: var(--primary); color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; display: inline-block; width: 100%; transition: 0.3s; }
        .btn-modal-login:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><i class="fa-solid fa-cubes"></i> HABACHA <span>ENTERPRISE</span></a>
        <div class="nav-right">
            <a href="inventory.html"><i class="fa-solid fa-arrow-left"></i> Marketplace</a>
            <div id="user-session-nav">
                <!-- User session status injected dynamically -->
            </div>
        </div>
    </header>

    <div class="container" id="asset-detail-container">
        <!-- Asset content rendered via JavaScript based on URL ID -->
    </div>

    <!-- Login Required Gate Modal -->
    <div class="login-modal" id="login-gate">
        <div class="login-card">
            <i class="fa-solid fa-lock" style="font-size: 2.5rem; color: var(--accent-cyan); margin-bottom: 15px;"></i>
            <h3>Authentication Required</h3>
            <p>To reserve high-value enterprise assets and issue escrow requests, please log in with your verified client or supplier account.</p>
            <a href="login.html" class="btn-modal-login"><i class="fa-solid fa-right-to-bracket"></i> Login / Register Account</a>
            <button onclick="closeLoginGate()" style="background: none; border: none; color: var(--text-muted); margin-top: 15px; cursor: pointer; font-size: 0.85rem;">Cancel and Return</button>
        </div>
    </div>

    <script>
        const inventoryDatabase = [
            {
                id: '1',
                title: 'Gulfstream G650ER Jet',
                category: 'aviation',
                price: 9500,
                unit: 'per flight hour',
                image: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=1200',
                registration: 'N650ER / ICAO: G650',
                location: 'London Heathrow / Amsterdam Schiphol VIP Terminal',
                provider: 'Global Jet Operations Ltd',
                specs: {
                    'Max Passengers': '14 Executive VIP',
                    'Max Range': '7,500 Nautical Miles',
                    'Cruising Speed': 'Mach 0.90 (956 km/h)',
                    'Cabin Configuration': '3 Living Zones + Flight Crew Rest',
                    'Baggage Capacity': '195 cu ft Heavy Luggage',
                    'Safety Rating': 'ARGUS Platinum / Wyvern Wingman'
                },
                description: 'The Gulfstream G650ER is the pinnacle of long-range executive aviation. Featuring intercontinental range without refueling, pressurized quiet cabin altitude, and high-speed satellite Wi-Fi.'
            },
            {
                id: '2',
                title: 'Boeing 737-800 Cargo Freighter Aircraft',
                category: 'aviation',
                price: 18500,
                unit: 'per flight hour',
                image: 'https://images.unsplash.com/photo-1519074069444-1ba4eff56022?w=1200',
                registration: 'PH-B73 / ICAO: B738',
                location: 'Amsterdam Schiphol Cargo Hub (AMS)',
                provider: 'AeroFreight Cargo Alliance',
                specs: {
                    'Max Cargo Payload': '23.9 Metric Tons',
                    'Main Deck Volume': '141.5 m³ Payload Space',
                    'Cargo Door Specs': '86 in x 140 in Main Loading Door',
                    'Flight Range': '2,000 NM Full Load',
                    'Ramp Handling': 'Palletized Container Loading (PNA)',
                    'Compliance': 'EASA / FAA Heavy Cargo Certified'
                },
                description: 'Dedicated main-deck cargo freighter configured for rapid palletized freight, pharmaceutical transport, and heavy equipment logistics across Europe and Middle East routes.'
            },
            {
                id: '3',
                title: 'Panamax Bulk Cargo Carrier Vessel',
                category: 'maritime',
                price: 32000,
                unit: 'per charter day',
                image: 'https://images.unsplash.com/photo-1559136555-9303baea8ebd?w=1200',
                registration: 'IMO 9841203 / Flag: Marshall Islands',
                location: 'Port of Rotterdam Terminal 4',
                provider: 'Oceanic Bulk Maritime B.V.',
                specs: {
                    'Container Capacity': '4,500 TEU',
                    'Gross Tonnage': '54,000 GT',
                    'Deadweight Tonnage': '75,000 DWT',
                    'Draft Depth': '12.5 Meters Required',
                    'Marine Crew': 'Licensed Master Captain + 18 Crew',
                    'Bunkering Fuel': 'Low Sulfur VLSFO Included Option'
                },
                description: 'Heavy ocean-going Panamax bulk carrier equipped for international container freight, bulk commodities, and long-haul maritime trade lanes.'
            },
            {
                id: '4',
                title: 'Sunseeker 131 Ocean Mega Yacht',
                category: 'maritime',
                price: 14000,
                unit: 'per day',
                image: 'https://images.unsplash.com/photo-1567899378494-47b22a2ae96a?w=1200',
                registration: 'IMO 9123456 / Flag: Cayman Islands',
                location: 'Monaco / Côte d\'Azur Berth',
                provider: 'Riviera Yacht Management',
                specs: {
                    'Guest Capacity': '12 Sleeping Guests (40 Event)',
                    'Staterooms': '5 Executive Deluxe Suites',
                    'Length Overall': '40.05 Meters (131 ft)',
                    'Cruising Speed': '15 Knots (Top 20 Knots)',
                    'Crew Compliment': 'Master Captain, Chief Engineer + 7 Crew',
                    'Onboard Amenities': 'Jacuzzi, Tender Boat, Water Toys'
                },
                description: 'Tri-deck ocean yacht delivering unprecedented luxury, stabilized cruising, private chef options, and dedicated port berth clearance.'
            },
            {
                id: '5',
                title: 'Volvo FH16 750 Heavy Cargo Truck',
                category: 'logistics',
                price: 450,
                unit: 'per day',
                image: 'https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?w=1200',
                registration: 'VIN: YV2A0012 / Euro 6',
                location: 'Rotterdam Logistics Terminal',
                provider: 'TransEurope Fleet Logistics',
                specs: {
                    'Gross Combination Weight': '44 Metric Tons',
                    'Engine Power': '750 HP / 3550 Nm Torque',
                    'Emissions Standard': 'Euro 6 Ultra-Low Emission',
                    'Dispatch Access': 'Keyless Mobile App GPS Unlock',
                    'Trailer Hitch': 'Standard Fifth Wheel Coupling',
                    'Telematics': 'Live Fleet GPS Tracking Active'
                },
                description: 'Class-A heavy logistics freight tractor unit engineered for long-haul intermodal cargo transport, equipped with keyless app unlocking.'
            },
            {
                id: '7',
                title: 'Rotterdam Industrial Logistics Distribution Hub',
                category: 'realestate',
                price: 45000,
                unit: 'per month lease',
                image: 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=1200',
                registration: 'Parcel ID: NL-ROT-98210',
                location: 'Rotterdam Maasvlakte Industrial Zone',
                provider: 'EuroHub Real Estate Investment Trust',
                specs: {
                    'Total Floor Area': '18,000 m² High-Bay Storage',
                    'Loading Docks': '24 Automatic Hydraulic Docks',
                    'Clear Ceiling Height': '12.20 Meters',
                    'Floor Load Capacity': '50 kN/m²',
                    'Security Systems': '24/7 Guarded Gate + CCTV Escrow',
                    'Sustainability': 'BREEAM Excellent Certified'
                },
                description: 'Prime Grade-A logistics distribution center with direct highway and deepwater quay access, ideal for international freight distribution.'
            }
        ];

        let currentAsset = null;

        function getUrlParameter(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function checkUserSession() {
            const sessionRaw = localStorage.getItem('habacha_user_session');
            const navContainer = document.getElementById('user-session-nav');
            if (sessionRaw) {
                const session = JSON.parse(sessionRaw);
                navContainer.innerHTML = `
                    <div class="user-badge">
                        <i class="fa-solid fa-user-check"></i> ${session.name} (${session.role.toUpperCase()})
                        <a href="#" onclick="logoutUser()" style="color:var(--text-muted); margin-left:10px;"><i class="fa-solid fa-power-off"></i></a>
                    </div>
                `;
                return session;
            } else {
                navContainer.innerHTML = `<a href="login.html" class="user-badge" style="color:#fff;"><i class="fa-solid fa-lock"></i> Client / Supplier Login</a>`;
                return null;
            }
        }

        function logoutUser() {
            localStorage.removeItem('habacha_user_session');
            window.location.reload();
        }

        function renderAssetDetails() {
            const assetId = getUrlParameter('id') || '1';
            currentAsset = inventoryDatabase.find(a => a.id === assetId) || inventoryDatabase[0];

            const container = document.getElementById('asset-detail-container');
            
            // Build Product Specific Technical Specs
            const specsHtml = Object.entries(currentAsset.specs).map(([key, val]) => `
                <div class="spec-item">
                    <label>${key}</label>
                    <span>${val}</span>
                </div>
            `).join('');

            // Build Product Specific Booking Form Fields
            const specificFormFields = generateCategorySpecificFields(currentAsset.category);

            container.innerHTML = `
                <!-- Left Details Column -->
                <div>
                    <span class="asset-header-tag"><i class="fa-solid fa-layer-group"></i> ${currentAsset.category.toUpperCase()} DIVISION</span>
                    <h1 class="asset-main-title">${currentAsset.title}</h1>
                    <div class="asset-sub-info">
                        <span><i class="fa-solid fa-location-dot" style="color:var(--accent-cyan)"></i> ${currentAsset.location}</span>
                        <span><i class="fa-solid fa-barcode" style="color:var(--accent-cyan)"></i> ${currentAsset.registration}</span>
                    </div>

                    <div class="gallery-container">
                        <img src="${currentAsset.image}" alt="${currentAsset.title}">
                        <div class="verified-stamp">
                            <i class="fa-solid fa-shield-halved" style="color:var(--accent-cyan);"></i> Verified Asset & Supplier: ${currentAsset.provider}
                        </div>
                    </div>

                    <div class="spec-box">
                        <h4>Technical Specifications & Operational Capabilities</h4>
                        <div class="spec-grid">
                            ${specsHtml}
                        </div>
                    </div>

                    <div class="spec-box">
                        <h4>Operational Overview</h4>
                        <p style="color:var(--text-muted); font-size:0.95rem; line-height:1.7;">${currentAsset.description}</p>
                    </div>
                </div>

                <!-- Right Booking Column -->
                <div>
                    <div class="booking-sidebar">
                        <div class="rate-display">€${currentAsset.price.toLocaleString()} <span>/ ${currentAsset.unit}</span></div>
                        <div class="escrow-notice"><i class="fa-solid fa-lock"></i> 100% Escrow Contract Security Deposit Included</div>

                        <form id="asset-reservation-form" onsubmit="handleReservationSubmit(event)">
                            ${specificFormFields}

                            <div class="form-section-head">2. Contact Verification</div>
                            <div class="form-group">
                                <label>Authorized Representative Name *</label>
                                <input type="text" id="form_client_name" required placeholder="e.g. Alexander Wright">
                            </div>
                            <div class="form-group">
                                <label>Corporate Email Address *</label>
                                <input type="email" id="form_client_email" required placeholder="a.wright@enterprise.com">
                            </div>
                            <div class="form-group">
                                <label>Direct Phone / WhatsApp *</label>
                                <input type="tel" id="form_client_phone" required placeholder="+31 6 12345678">
                            </div>

                            <button type="submit" class="btn-reserve"><i class="fa-solid fa-paper-plane"></i> Submit Operational Order</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function generateCategorySpecificFields(category) {
            if (category === 'aviation') {
                return `
                    <div class="form-section-head">1. Flight Clearance & Route</div>
                    <div class="form-group">
                        <label>Departure Airport (ICAO / IATA Code) *</label>
                        <input type="text" id="param_origin" required placeholder="e.g. EHAM / AMS (Amsterdam)">
                    </div>
                    <div class="form-group">
                        <label>Destination Airport (ICAO / IATA Code) *</label>
                        <input type="text" id="param_dest" required placeholder="e.g. EGLL / LHR (London)">
                    </div>
                    <div class="form-group">
                        <label>Flight Departure Date & Time *</label>
                        <input type="datetime-local" id="param_datetime" required>
                    </div>
                    <div class="form-group">
                        <label>Passengers / Freight Weight (Tons) *</label>
                        <input type="text" id="param_load" required placeholder="e.g. 8 VIP Passengers or 12 Tons Cargo">
                    </div>
                    <div class="form-group">
                        <label>Flight Crew & Ramp Handling</label>
                        <select id="param_crew">
                            <option value="full_crew">Captain, First Officer & VIP Cabin Crew Included</option>
                            <option value="dry_lease">Dry Lease (Client Provides Certified Crew)</option>
                        </select>
                    </div>
                `;
            } else if (category === 'maritime') {
                return `
                    <div class="form-section-head">1. Voyage & Port Berth Setup</div>
                    <div class="form-group">
                        <label>Departure Port *</label>
                        <input type="text" id="param_origin" required placeholder="e.g. Port of Rotterdam">
                    </div>
                    <div class="form-group">
                        <label>Destination Port *</label>
                        <input type="text" id="param_dest" required placeholder="e.g. Port of Singapore">
                    </div>
                    <div class="form-group">
                        <label>Charter Duration (Days) *</label>
                        <input type="number" id="param_duration" min="1" value="7" required>
                    </div>
                    <div class="form-group">
                        <label>Marine Crew & Bunkering Setup</label>
                        <select id="param_crew">
                            <option value="full_marine_crew">Master Captain & Full Marine Crew Included</option>
                            <option value="bareboat">Bareboat Charter (Client Crew)</option>
                        </select>
                    </div>
                `;
            } else if (category === 'logistics') {
                return `
                    <div class="form-section-head">1. Freight Transport & Dispatch</div>
                    <div class="form-group">
                        <label>Pickup Terminal / Address *</label>
                        <input type="text" id="param_origin" required placeholder="e.g. Schiphol Freight Hub 3">
                    </div>
                    <div class="form-group">
                        <label>Drop-off Location *</label>
                        <input type="text" id="param_dest" required placeholder="e.g. Frankfurt Freight Center">
                    </div>
                    <div class="form-group">
                        <label>Hazardous Cargo (ADR Classification)</label>
                        <select id="param_adr">
                            <option value="none">Standard Non-Hazardous Cargo</option>
                            <option value="adr_certified">ADR Certified Hazardous Materials</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Fulfillment Option</label>
                        <select id="param_dispatch">
                            <option value="gps_app">Keyless Instant Mobile GPS Unlock (Self-Drive)</option>
                            <option value="driver_included">Professional Heavy Freight Driver Included</option>
                        </select>
                    </div>
                `;
            } else { // Real Estate
                return `
                    <div class="form-section-head">1. Commercial Lease Terms</div>
                    <div class="form-group">
                        <label>Lease Commencement Date *</label>
                        <input type="date" id="param_start" required>
                    </div>
                    <div class="form-group">
                        <label>Lease Duration *</label>
                        <select id="param_lease">
                            <option value="6_months">6 Months Commercial Lease</option>
                            <option value="12_months">12 Months Commercial Lease</option>
                            <option value="multi_year">Multi-Year Enterprise Lease</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Escrow Guarantee Preference</label>
                        <select id="param_escrow">
                            <option value="standard_escrow">HABACHA Escrow Security Clearance</option>
                            <option value="bank_guarantee">Direct Bank Guarantee</option>
                        </select>
                    </div>
                `;
            }
        }

        function handleReservationSubmit(e) {
            e.preventDefault();
            const session = checkUserSession();
            if (!session) {
                document.getElementById('login-gate').style.display = 'flex';
                return;
            }

            const bookingDetails = {
                asset_title: currentAsset.title,
                category: currentAsset.category,
                client_name: document.getElementById('form_client_name').value,
                client_email: document.getElementById('form_client_email').value,
                client_phone: document.getElementById('form_client_phone').value,
                origin: document.getElementById('param_origin') ? document.getElementById('param_origin').value : 'N/A'
            };

            if (typeof HABACHA_ENGINE !== 'undefined') {
                HABACHA_ENGINE.processBookingSubmission(bookingDetails);
            }

            window.location.href = 'success.html';
        }

        function closeLoginGate() {
            document.getElementById('login-gate').style.display = 'none';
        }

        // Initialize Page
        checkUserSession();
        renderAssetDetails();
    </script>
</body>
</html>
