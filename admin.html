<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | HABACHA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b132b; color: #fff; font-family: sans-serif; }
        .text-gold { color: #c5a059; }
        .bg-gold { background-color: #c5a059; color: #000; }
    </style>
</head>
<body class="py-5">
    <div class="container max-w-md">
        <h1 class="text-gold mb-4 fw-bold">System Admin Console</h1>
        <div class="bg-dark p-4 rounded border border-secondary">
            <h2 class="h5 text-gold mb-3">Email Dispatcher Configuration</h2>
            <div class="mb-3">
                <label>Resend API Key</label>
                <input type="password" id="key" class="form-control bg-black text-white" placeholder="re_...">
            </div>
            <div class="mb-4">
                <label>Admin Notification Email</label>
                <input type="email" id="email" class="form-control bg-black text-white" placeholder="you@gmail.com">
            </div>
            <button onclick="save()" class="btn bg-gold w-100 fw-bold">Save System State</button>
            <p id="msg" class="text-success mt-3 d-none text-center">Settings Locked Successfully!</p>
        </div>
        <div class="mt-4 text-center"><a href="inventory.html" class="text-secondary">Return to Marketplace</a></div>
    </div>
    <script>
        document.getElementById('key').value = localStorage.getItem('resend_api_key') || '';
        document.getElementById('email').value = localStorage.getItem('admin_email_address') || '';
        function save() {
            localStorage.setItem('resend_api_key', document.getElementById('key').value.trim());
            localStorage.setItem('admin_email_address', document.getElementById('email').value.trim());
            document.getElementById('msg').classList.remove('d-none');
            setTimeout(()=> document.getElementById('msg').classList.add('d-none'), 3000);
        }
    </script>
</body>
</html>
