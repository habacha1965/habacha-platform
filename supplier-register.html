<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Onboarding | HABACHA Fleet Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1329; color: #ffffff; }
        .bg-navy-dark { background-color: #0b1329; }
        .bg-navy-light { background-color: #0f172a; }
        .border-navy { border-color: #1e293b; }
        .text-cyan { color: #0ea5e9; }
        .bg-cyan { background-color: #0ea5e9; }
        .bg-blue-soft { background-color: rgba(37, 99, 235, 0.2); }
        .bg-blue-600 { background-color: #2563eb; }

        select {
            background-color: #0f172a !important;
            color: white !important;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.25em 1.25em;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="p-6 border-b border-navy flex justify-between items-center bg-navy-light">
        <div class="flex items-center space-x-2 cursor-pointer" onclick="window.location.href='index.html'">
            <div class="w-8 h-8 bg-cyan rounded flex items-center justify-center">
                <i class="fa-solid fa-right-left text-navy-dark text-lg"></i>
            </div>
            <span class="text-2xl font-bold tracking-tight text-white uppercase">HABACHA</span>
        </div>
        <a href="login.html" class="text-sm font-semibold text-gray-400 hover:text-cyan transition">Supplier Login</a>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6 py-12">
        <div class="w-full max-w-3xl">
            <div class="bg-navy-light border border-navy rounded-xl p-8 shadow-2xl">
                <div class="flex items-center space-x-4 mb-6">
                    <div class="w-12 h-12 bg-blue-soft border border-navy rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-truck-moving text-cyan text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold">Fleet Onboarding</h1>
                        <p class="text-gray-400 text-sm">Apply to list your assets on the international exchange.</p>
                    </div>
                </div>

                <form id="supplier-form" class="space-y-6" onsubmit="handleSupplierReg(event)">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <div class="min-h-[30px] flex items-end"><label class="text-xs font-bold text-gray-400 uppercase mb-1">Company Registered Name</label></div>
                            <input type="text" required placeholder="Global Fleet Solutions" class="w-full bg-navy-dark border border-navy rounded-md h-12 px-4 focus:border-cyan outline-none transition text-white text-sm">
                        </div>
                        <div>
                            <div class="min-h-[30px] flex items-end"><label class="text-xs font-bold text-gray-400 uppercase mb-1">Primary Asset Division</label></div>
                            <select required class="w-full bg-navy-dark border border-navy rounded-md h-12 px-4 focus:border-cyan outline-none transition text-white text-sm">
                                <option value="1">Cars & Passenger Vans</option>
                                <option value="2">Commercial & Freight</option>
                                <option value="3">Marine & Shipping</option>
                                <option value="4">Aviation & Aircraft</option>
                                <option value="6">Industrial & Construction</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <div class="min-h-[30px] flex items-end"><label class="text-xs font-bold text-gray-400 uppercase mb-1">Headquarters / Main Region</label></div>
                            <input type="text" required placeholder="e.g. Amsterdam, NL" class="w-full bg-navy-dark border border-navy rounded-md h-12 px-4 focus:border-cyan outline-none transition text-white text-sm">
                        </div>
                        <div>
                            <div class="min-h-[30px] flex items-end"><label class="text-xs font-bold text-gray-400 uppercase mb-1">Direct Booking Portal URL</label></div>
                            <input type="url" required placeholder="https://your-website.com/book" class="w-full bg-navy-dark border border-navy rounded-md h-12 px-4 focus:border-cyan outline-none transition text-white text-sm">
                        </div>
                    </div>

                    <div class="bg-navy-dark p-6 rounded-lg border border-navy space-y-4">
                        <h3 class="text-xs font-bold text-white uppercase tracking-widest">Compliance Documentation</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-[10px] text-gray-500 uppercase mb-2">Commercial Registry (PDF)</label>
                                <input type="file" required class="block w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-navy-light file:text-cyan hover:file:bg-opacity-80">
                            </div>
                            <div>
                                <label class="block text-[10px] text-gray-500 uppercase mb-2">Fleet Insurance Certificate (PDF)</label>
                                <input type="file" required class="block w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-navy-light file:text-cyan hover:file:bg-opacity-80">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-md transition uppercase tracking-widest text-xs">
                        Submit Onboarding Application
                    </button>
                    
                    <p class="text-[10px] text-gray-500 text-center uppercase leading-relaxed">
                        By submitting, you agree to HABACHA's intermediary fees and verified supplier protocols. <br>Applications are reviewed within 48 business hours.
                    </p>
                </form>
            </div>
        </div>
    </main>

    <script>
        function handleSupplierReg(e) {
            e.preventDefault();
            alert('Application submitted! Our partner team will contact you shortly. Redirecting to portal...');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
