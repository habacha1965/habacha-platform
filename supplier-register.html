<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Onboarding - HABACHA Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-1.5 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                </div>
                <span class="font-bold text-xl tracking-wider text-slate-900">HABACHA</span>
            </a>
            <a href="login.html" class="text-sm font-semibold text-blue-600 hover:text-blue-700">Supplier Login</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-12 flex-grow flex flex-col justify-center">
        <div class="bg-white p-8 md:p-10 rounded-2xl border border-slate-200 shadow-sm">
            <h1 class="text-2xl font-bold text-slate-900">Fleet Onboarding Application</h1>
            <p class="text-xs text-slate-500 mt-1 mb-8">Apply to list your assets on the international exchange (No Cure, No Pay).</p>

            <form action="supplier-dashboard.html" class="space-y-4 text-sm">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Company Registered Name</label>
                        <input type="text" required placeholder="Global Fleet Solutions Ltd" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Primary Asset Division</label>
                        <select class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none">
                            <option>Cars & Passenger Vans</option>
                            <option>Commercial Vans & Freight Trucks</option>
                            <option>Boats, Yachts & Cargo Ships</option>
                            <option>Helicopters & Aircraft</option>
                            <option>Stays, Accommodations & Real Estate</option>
                            <option>Construction Machinery & Equipment</option>
                            <option>Campers, RVs & Leisure Mobility</option>
                            <option>Event & Audio/Visual Equipment</option>
                        </select>
                    </div>
                </div>

                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Headquarters / Main Region</label>
                        <input type="text" required placeholder="e.g. Amsterdam Airport (AMS)" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">Direct Booking Portal URL</label>
                        <input type="url" required placeholder="https://your-company.com/book" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-200">
                    <button type="submit" class="w-full py-3.5 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition">Submit Onboarding Application</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-xs">
            <p>© 2026 HABACHA Intermediary Exchange. All rights reserved.</p>
            <div class="flex gap-6">
                <a href="terms.html" class="hover:text-white">Terms of Service</a>
                <a href="supplier-agreement.html" class="hover:text-white">Supplier Agreement</a>
                <a href="privacy.html" class="hover:text-white">Privacy Policy</a>
                <a href="cookies.html" class="hover:text-white">Cookie Policy</a>
            </div>
        </div>
    </footer>
</body>
</html>
