<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Registration | HABACHA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
    <!-- SEO: Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "HABACHA",
      "alternateName": "HABACHA Global Intermediary",
      "url": "https://habacha-platform.vercel.app/",
      "logo": "https://habacha-platform.vercel.app/logo.png",
      "description": "Global intermediary platform connecting clients with verified rental and leasing suppliers across 8 divisions: Cars & Vans, Commercial Freight, Boats & Yachts, Helicopters & Aircraft, Stays & Real Estate, Construction Machinery, Campers & RVs, and Event & AV Equipment.",
      "foundingDate": "2026",
      "areaServed": {
        "@type": "Place",
        "name": "Worldwide"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "service4companys@gmail.com",
        "availableLanguage": ["English"]
      }
    }
    </script>
    <!-- SEO: Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "HABACHA",
      "url": "https://habacha-platform.vercel.app/",
      "inLanguage": "en",
      "publisher": {
        "@type": "Organization",
        "name": "HABACHA"
      }
    }
    </script>
    <!-- SEO: Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/%3E%3C/svg%3E">
</head>
<body class="bg-slate-900 text-slate-900 min-h-screen flex flex-col relative overflow-x-hidden">
    <!-- Premium Achtergrond -->
    <div class="fixed inset-0 bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 opacity-95 -z-10"></div>
    <div class="fixed inset-0 bg-[linear-gradient(rgba(255,255,255,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.03)_1px,transparent_1px)] bg-[size:40px_40px] -z-10"></div>
    <header class="relative z-10 py-4 px-6 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2">
            <div class="bg-blue-600 text-white p-1.5 rounded-lg shadow-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <span class="font-bold text-xl text-white tracking-wider">HABACHA</span>
        </a>
        <a href="index.html" class="text-sm font-semibold text-slate-300 hover:text-white transition">&larr; Return to Homepage</a>
    </header>

    <main class="relative z-10 flex-grow flex items-center justify-center p-6">
        <div class="max-w-xl w-full">
            <form id="supplier-form" class="bg-white/95 backdrop-blur-sm p-8 md:p-10 rounded-3xl shadow-2xl border border-white/20">
                <div class="text-center mb-8">
                    <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-2 tracking-tight">Become a HABACHA Supplier</h1>
                    <p class="text-slate-600">Join our founding network. Get 50% off your first year.</p>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Company Name</label>
                    <input type="text" id="companyName" required class="w-full h-12 px-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Contact Email</label>
                    <input type="email" id="contactEmail" required class="w-full h-12 px-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Create a Password</label>
                    <input type="password" id="contactPassword" required class="w-full h-12 px-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500" placeholder="Min. 6 characters">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Which Division?</label>
                    <select id="category" required class="w-full h-12 px-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500">
                        <option value="cars">Cars & Vans</option>
                        <option value="commercial">Commercial Freight</option>
                        <option value="maritime">Boats & Yachts</option>
                        <option value="aviation">Helicopters & Aircraft</option>
                        <option value="stays">Stays & Real Estate</option>
                        <option value="industrial">Construction Machinery</option>
                        <option value="leisure">Campers & RVs</option>
                        <option value="event">Event & AV Equipment</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Website URL</label>
                    <input type="url" id="websiteUrl" required class="w-full h-12 px-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500" placeholder="https://yourcompany.com">
                </div>
                <div class="mb-8">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Unique Contract Link</label>
                    <input type="url" id="contractLink" required class="w-full h-12 px-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500" placeholder="https://yourcompany.com/book?ref=">
                    <p class="text-xs text-slate-500 mt-1">This is where we send the customer with their unique HB-code.</p>
                </div>

                <button type="submit" id="submitBtn" class="w-full h-12 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-lg">
                    Register & Claim 50% Discount
                </button>
            </form>
        </div>
    </main>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const supabaseUrl = 'https://fwiyrtchfbjpwrbvzynb.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3aXlydGNoZmJqcHdyYnZ6eW5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NTkyODYsImV4cCI6MjEwODUzNTI4Nn0.yGU478L57XpJRq3qsk48KV4xem0BwipRIwqilTAPI4k';
        const supabase = createClient(supabaseUrl, supabaseKey);

        document.getElementById('supplier-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Processing...';
            btn.disabled = true;

            const company = document.getElementById('companyName').value;
            const email = document.getElementById('contactEmail').value;
            const password = document.getElementById('contactPassword').value;
            const category = document.getElementById('category').value;
            const website = document.getElementById('websiteUrl').value;
            const contract = document.getElementById('contractLink').value;

            // Hash het wachtwoord
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const passwordHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            const { error } = await supabase.from('suppliers').insert([{
                company_name: company,
                contact_email: email,
                password_hash: passwordHash,
                category: category,
                website_url: website,
                contract_link: contract
            }]);

            if (error) {
                alert('Database Error: ' + error.message);
                btn.innerText = 'Register & Claim 50% Discount';
                btn.disabled = false;
                return;
            }

            try {
                await fetch('https://habacha-platform.vercel.app/api/send-supplier-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ companyName: company, contactEmail: email })
                });
            } catch (err) { console.log('Email API error', err); }

            window.location.href = 'supplier-success.html';
        });
    </script>
    <!-- Footer -->
    <footer class="relative z-10 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-6 text-center text-sm text-slate-400">
            <p>&copy; 2026 HABACHA. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
