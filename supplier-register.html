<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Registration | HABACHA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 flex justify-between items-center">
        <a href="index.html" class="font-bold text-xl text-slate-900 tracking-wider">HABACHA</a>
        <a href="index.html" class="text-sm font-semibold text-blue-600 hover:underline">Return to Main Page</a>
    </header>

    <!-- Main Form -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-xl w-full">
            <form id="supplier-form" class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-slate-900 mb-2">Become a HABACHA Supplier</h1>
                    <p class="text-slate-600">Join our founding network. Get 50% off your first year.</p>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Company Name</label>
                    <input type="text" id="companyName" required class="w-full h-12 px-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Contact Email</label>
                    <input type="email" id="contactEmail" required class="w-full h-12 px-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Which Division?</label>
                    <select id="category" required class="w-full h-12 px-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500">
                        <option value="cars">Cars & Vans</option>
                        <option value="commercial">Commercial Freight</option>
                        <option value="maritime">Boats & Yachts</option>
                        <option value="aviation">Helicopters & Aircraft</option>
                        <option value="stays">Stays & Real Estate</option>
                        <option value="industrial">Construction Machinery</option>
                        <option value="leisure">Campers & RVs</option>
                        <option value="event">Event & AV Equipment</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Website URL</label>
                    <input type="url" id="websiteUrl" required class="w-full h-12 px-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500" placeholder="https://yourcompany.com">
                </div>
                <div class="mb-8">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Unique Contract Link</label>
                    <input type="url" id="contractLink" required class="w-full h-12 px-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500" placeholder="https://yourcompany.com/book?ref=">
                    <p class="text-xs text-slate-500 mt-1">This is where we send the customer with their unique HB-code.</p>
                </div>

                <button type="submit" id="submitBtn" class="w-full h-12 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-lg">
                    Register & Claim 50% Discount
                </button>
            </form>
        </div>
    </main>

    <!-- JavaScript -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        
        const supabaseUrl = 'https://fwiyrtchfbjpwrbvzynb.supabase.co';
        const supabaseKey = 'sb_publishable_rej1BmE3pLsiHB2fOrrGqA_IkcGBCX5'; // Wordt hieronder automatisch vervangen
        const supabase = createClient(supabaseUrl, supabaseKey);

        document.getElementById('supplier-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Processing...';
            btn.disabled = true;

            const company = document.getElementById('companyName').value;
            const email = document.getElementById('contactEmail').value;
            const category = document.getElementById('category').value;
            const website = document.getElementById('websiteUrl').value;
            const contract = document.getElementById('contractLink').value;

            // 1. Opslaan in Supabase
            const { error } = await supabase.from('suppliers').insert([{
                company_name: company,
                contact_email: email,
                category: category,
                website_url: website,
                contract_link: contract
            }]);

            if (error) {
                alert('Database Error: ' + error.message);
                btn.innerText = 'Register & Claim 50% Discount';
                btn.disabled = false;
                return;
            }

            // 2. E-mail sturen via API
            try {
                await fetch('https://habacha-platform.vercel.app/api/send-supplier-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ companyName: company, contactEmail: email })
                });
            } catch (err) {
                console.log('Email API error', err);
            }

            // 3. Direct doorsturen naar de professionele bedankpagina
            window.location.href = 'supplier-success.html';
        });
    </script>
</body>
</html>
