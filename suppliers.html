<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Your Asset / Fleet | HABACHA Platform</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo-container"><a href="index.html" class="logo-text">HABACHA</a></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="inventory.html">Browse Assets</a>
      <a href="onboarding.html">Rent / Charter</a>
      <a href="suppliers.html" class="active">Suppliers (B2B)</a>
    </nav>
  </header>

  <div class="container" style="max-width: 900px; margin: 50px auto; padding: 0 20px;">
    <div style="text-align: center; margin-bottom: 40px;">
      <h1>Asset & Fleet Owner Onboarding</h1>
      <p style="color: #94A3B8; font-size: 1.1rem; margin-top: 10px;">Monetize your unutilized high-value assets securely.</p>
    </div>

    <div style="background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(197, 168, 128, 0.2); border-radius: 16px; padding: 35px; backdrop-filter: blur(10px);">
      <form id="supplierForm">
        <h3 style="color: #C5A880; border-bottom: 1px solid rgba(197,168,128,0.2); padding-bottom: 10px; margin-top: 0;">1. Operator Identity</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
          <div><label style="display:block; margin-bottom: 8px; color: #fff;">Company Name *</label><input type="text" id="companyName" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;"></div>
          <div><label style="display:block; margin-bottom: 8px; color: #fff;">Contact Person *</label><input type="text" id="contactName" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;"></div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
          <div><label style="display:block; margin-bottom: 8px; color: #fff;">Corporate Email *</label><input type="email" id="email" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;"></div>
          <div><label style="display:block; margin-bottom: 8px; color: #fff;">Phone / Direct *</label><input type="tel" id="phone" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 8px;"></div>
        </div>

        <h3 style="color: #C5A880; border-bottom: 1px solid rgba(197,168,128,0.2); padding-bottom: 10px; margin-top: 30px;">2. Asset Specifications</h3>
        <div style="margin-bottom: 20px;">
          <select id="supplierCategory" onchange="renderAssetSpecFields()" required style="width: 100%; padding: 12px; background: #0F172A; border: 1px solid #C5A880; color: #fff; border-radius: 8px; font-size: 1rem;">
            <option value="car_van_truck">Vehicles (Luxury Cars, Vans, Trucks)</option>
            <option value="jet_aircraft">Aviation (Private Jets, Cargo Planes)</option>
            <option value="yacht_ship">Maritime (Luxury Yachts, Cargo Ships)</option>
          </select>
        </div>
        <div id="dynamicAssetSpecsContainer"></div>

        <h3 style="color: #C5A880; border-bottom: 1px solid rgba(197,168,128,0.2); padding-bottom: 10px; margin-top: 30px;">3. Image Gallery & Registration</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
          <div>
            <label style="display:block; margin-bottom: 8px; color: #fff;">Asset Photos *</label>
            <input type="file" id="assetPhotosFile" multiple accept="image/*" required style="width: 100%; padding: 10px; background: #0F172A; border: 1px dashed rgba(197,168,128,0.4); color: #fff; border-radius: 8px;">
          </div>
          <div>
            <label style="display:block; margin-bottom: 8px; color: #fff;">Ownership / AOC Docs *</label>
            <input type="file" id="ownershipDocFile" accept="image/*,application/pdf" required style="width: 100%; padding: 10px; background: #0F172A; border: 1px dashed rgba(197,168,128,0.4); color: #fff; border-radius: 8px;">
          </div>
        </div>

        <button type="submit" id="supplierSubmitBtn" class="btn-primary" style="width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 600; text-transform: uppercase;">Submit Asset Listing</button>
        <div id="supplierFormResponse" style="margin-top: 20px; font-weight: 600; text-align: center;"></div>
      </form>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script>
    function renderAssetSpecFields() {
      const cat = document.getElementById('supplierCategory').value;
      const container = document.getElementById('dynamicAssetSpecsContainer');
      if (cat === 'jet_aircraft') {
        container.innerHTML = `
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Manufacturer *</label><input type="text" id="specMake" required placeholder="e.g. Gulfstream" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Model *</label><input type="text" id="specModel" required placeholder="e.g. G650ER" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Tail Number *</label><input type="text" id="specReg" required placeholder="e.g. N650GX" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Year of Mfg / Refit</label><input type="number" id="specYear" placeholder="2022" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Hourly Rate (€/$)</label><input type="number" id="specRate" placeholder="4500" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Base Airport (ICAO) *</label><input type="text" id="specLocation" required placeholder="e.g. EHAM" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
          </div>`;
      } else if (cat === 'yacht_ship') {
        container.innerHTML = `
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Shipyard / Builder *</label><input type="text" id="specMake" required placeholder="e.g. Lürssen" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Vessel Name *</label><input type="text" id="specModel" required style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Length (LOA) *</label><input type="text" id="specRange" required placeholder="e.g. 50m / 164ft" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Cabins</label><input type="number" id="specYear" placeholder="6" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Weekly Rate (€/$)</label><input type="number" id="specRate" placeholder="150000" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Base Port *</label><input type="text" id="specLocation" required placeholder="e.g. Monaco" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
          </div>`;
      } else {
        container.innerHTML = `
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Brand *</label><input type="text" id="specMake" required placeholder="e.g. Mercedes" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Model *</label><input type="text" id="specModel" required placeholder="e.g. S-Class" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Year *</label><input type="number" id="specYear" required placeholder="2024" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">License Plate</label><input type="text" id="specReg" placeholder="e.g. 8-XYZ-99" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Daily Rate (€/$)</label><input type="number" id="specRate" placeholder="1200" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
            <div><label style="display:block; margin-bottom: 6px; color: #94A3B8;">Base Location *</label><input type="text" id="specLocation" required placeholder="e.g. Amsterdam" style="width: 100%; padding: 10px; background: #0F172A; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px;"></div>
          </div>`;
      }
    }
    document.addEventListener('DOMContentLoaded', renderAssetSpecFields);

    document.getElementById('supplierForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('supplierSubmitBtn');
      btn.disabled = true; btn.textContent = 'Uploading secure data...';
      
      const res = await window.habachaDB.submitSupplier({
        company_name: document.getElementById('companyName').value,
        contact_name: document.getElementById('contactName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        asset_categories: [document.getElementById('supplierCategory').value],
        status: 'pending'
      });

      if (res.success) window.location.href = 'success.html';
      else { btn.disabled = false; btn.textContent = 'Submit Asset Listing'; alert('Error: ' + res.message); }
    });
  </script>
</body>
</html>
